<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behavior Tree Editor</title>
    <link rel="stylesheet" href="{{CODICON_CSS_URI}}">
    <link rel="stylesheet" href="BehaviorTree.css">
    <link rel="stylesheet" href="BehaviorTree-template.css">
    <script>
        console.log('BehaviorTree HTML loaded');
        window.addEventListener('error', function(e) {
            console.error('Window error:', e.error, e.message, e.filename, e.lineno);
        });
    </script>
</head>
<body>
    <div id="app">
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="saveBtn" class="btn btn-primary" title="Save (Ctrl+S)">
                    <i class="codicon codicon-save"></i> Save
                </button>
                <button id="addNodeBtn" class="btn" title="Add Node">
                    <i class="codicon codicon-add"></i> Add Node
                </button>
                <button id="addFromTemplateBtn" class="btn" title="Add Node from Template">
                    <i class="codicon codicon-file-code"></i> Template
                </button>
                <button id="deleteNodeBtn" class="btn btn-danger" title="Delete Selected (Delete)">
                    <i class="codicon codicon-trash"></i> Delete
                </button>
            </div>
            <div class="toolbar-group">
                <button id="zoomInBtn" class="btn" title="Zoom In">
                    <i class="codicon codicon-zoom-in"></i>
                </button>
                <button id="zoomOutBtn" class="btn" title="Zoom Out">
                    <i class="codicon codicon-zoom-out"></i>
                </button>
                <button id="fitBtn" class="btn" title="Fit Canvas">
                    <i class="codicon codicon-screen-normal"></i> Fit
                </button>
            </div>
            <div class="toolbar-group">
                <label class="tree-name-label">
                    Tree Name:
                    <input type="text" id="treeNameInput" class="tree-name-input" placeholder="Behavior tree name">
                </label>
            </div>
            <div class="toolbar-group" style="margin-left: auto;">
                <button id="openTextBtn" class="btn" title="Open in Text Editor (Split Right)">
                    <i class="codicon codicon-go-to-file"></i> Text Mode
                </button>
            </div>
        </div>

        <div class="main-container">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>

            <div class="properties-panel" id="propertiesPanel">
                <div class="panel-header">
                    <h3>Properties</h3>
                    <button id="closePanelBtn" class="close-btn">×</button>
                </div>
                <div class="panel-content" id="propertiesContent">
                    <p class="empty-state">Please select a node</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Node Dialog -->
    <div id="addNodeDialog" class="dialog" style="display: none;">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3>Add Node</h3>
                <button class="close-btn" onclick="closeAddNodeDialog()">×</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>Node Type:</label>
                    <select id="nodeTypeSelect">
                        <option value="Sequence">Sequence</option>
                        <option value="Selector">Selector</option>
                        <option value="Parallel">Parallel</option>
                        <option value="Condition">Condition</option>
                        <option value="Action">Action</option>
                        <option value="Decorator">Decorator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Identifier (Key):</label>
                    <input type="text" id="nodeKeyInput" placeholder="e.g.: Heal, Attack, CheckHealth">
                </div>
                <div class="form-group">
                    <label>Display Name (Name):</label>
                    <input type="text" id="nodeNameInput" placeholder="e.g.: Heal, Attack, Check Health">
                </div>
                <div class="form-group">
                    <label>Description (optional):</label>
                    <textarea id="nodeDescInput" placeholder="Enter node description" rows="3"></textarea>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeAddNodeDialog()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmAddNode()">Add</button>
            </div>
        </div>
    </div>

    <!-- Template Selection Dialog -->
    <div id="templateDialog" class="dialog" style="display: none;">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3>Select Template</h3>
                <button class="close-btn" onclick="closeTemplateDialog()">×</button>
            </div>
            <div class="dialog-body">
                <!-- Search and Filter Bar -->
                <div class="template-filter-bar">
                    <div class="template-search-box">
                        <span class="codicon codicon-search"></span>
                        <input type="text" id="templateSearchInput" placeholder="Search templates (name, description, type, key)" oninput="editor.filterTemplates()">
                        <button class="clear-search-btn" onclick="editor.clearTemplateSearch()" title="Clear Search">
                            <span class="codicon codicon-close"></span>
                        </button>
                    </div>
                    <div class="template-type-filters">
                        <button class="type-filter-btn active" data-type="all" onclick="editor.toggleTemplateType('all')">
                            <span class="codicon codicon-filter"></span> All
                        </button>
                        <button class="type-filter-btn" data-type="Sequence" onclick="editor.toggleTemplateType('Sequence')">
                            <span class="type-badge" style="background-color: #2196F3;"></span> Sequence
                        </button>
                        <button class="type-filter-btn" data-type="Selector" onclick="editor.toggleTemplateType('Selector')">
                            <span class="type-badge" style="background-color: #FF9800;"></span> Selector
                        </button>
                        <button class="type-filter-btn" data-type="Parallel" onclick="editor.toggleTemplateType('Parallel')">
                            <span class="type-badge" style="background-color: #4CAF50;"></span> Parallel
                        </button>
                        <button class="type-filter-btn" data-type="Condition" onclick="editor.toggleTemplateType('Condition')">
                            <span class="type-badge" style="background-color: #00BCD4;"></span> Condition
                        </button>
                        <button class="type-filter-btn" data-type="Action" onclick="editor.toggleTemplateType('Action')">
                            <span class="type-badge" style="background-color: #F44336;"></span> Action
                        </button>
                        <button class="type-filter-btn" data-type="Decorator" onclick="editor.toggleTemplateType('Decorator')">
                            <span class="type-badge" style="background-color: #E91E63;"></span> Decorator
                        </button>
                    </div>
                    <div class="template-sort-bar">
                        <label>Sort:</label>
                        <select id="templateSortSelect" onchange="editor.sortTemplates()">
                            <option value="name-asc">Name A-Z</option>
                            <option value="name-desc">Name Z-A</option>
                            <option value="type-asc">Type A-Z</option>
                            <option value="date-desc" selected>Newest</option>
                            <option value="date-asc">Oldest</option>
                        </select>
                    </div>
                </div>
                <!-- Template List -->
                <div id="templateList" class="template-list">
                    <p class="empty-state">Loading templates...</p>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeTemplateDialog()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Save Template Dialog -->
    <div id="saveTemplateDialog" class="dialog" style="display: none;">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3>Save as Template</h3>
                <button class="close-btn" onclick="closeSaveTemplateDialog()">×</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>Template Name:</label>
                    <input type="text" id="templateNameInput" placeholder="e.g.: Heal Ability">
                </div>
                <div class="form-group">
                    <label>Template Description (optional):</label>
                    <textarea id="templateDescInput" rows="3" placeholder="Enter template description"></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="templateIncludeChildren" class="vscode-checkbox" checked>
                        <span class="checkbox-indicator"></span>
                        <span class="checkbox-text">Include Children</span>
                    </label>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeSaveTemplateDialog()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmSaveTemplate()">Save</button>
            </div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirmDialog" class="dialog" style="display: none;">
        <div class="dialog-content" style="min-width: 300px;">
            <div class="dialog-header">
                <h3>Confirm</h3>
                <button class="close-btn" onclick="closeConfirmDialog()">×</button>
            </div>
            <div class="dialog-body">
                <p id="confirmMessage">Are you sure?</p>
            </div>
            <div class="dialog-footer">
                <button class="btn" onclick="closeConfirmDialog()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmAction()">OK</button>
            </div>
        </div>
    </div>

    <!-- All UI text is now in English by default; no i18n override script needed -->
    <script>
    // Intentionally left empty - HTML content is already in English
    </script>
    <script src="BehaviorTree.js"></script>
</body>
</html>
