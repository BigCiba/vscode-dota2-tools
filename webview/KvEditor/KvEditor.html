<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="KvEditor.css" />
	<script defer src="KvEditor.js"></script>
</head>

<body>
	<div class="kv-container">
		<header class="kv-header">
			<div class="kv-header-content">
				<div class="kv-header-title">
					<h2 id="kv-file-name"></h2>
					<p id="kv-file-meta" class="kv-subtitle"></p>
				</div>
				<div class="kv-header-actions">
					<button id="kv-open-localization-file" class="kv-header-button" type="button" title="打开本地化文件" disabled>
						<span class="codicon codicon-book"></span>
					</button>
					<button id="kv-toggle-localized-mode" class="kv-header-button" type="button" title="切换本地化模式">
						<span class="codicon codicon-globe"></span>
					</button>
					<button id="kv-toggle-compact-mode" class="kv-header-button" type="button" title="切换精简模式">
						<span class="codicon codicon-list-tree"></span>
					</button>
					<button id="kv-localization-settings" class="kv-header-button" type="button" title="本地化设置">
						<span class="codicon codicon-settings-gear"></span>
					</button>
					<button id="kv-open-text-editor" class="kv-header-button" type="button" title="用文本编辑器打开">
						<span class="codicon codicon-go-to-file"></span>
					</button>
				</div>
			</div>
		</header>
		<section id="kv-external-change" class="kv-external-change" hidden>
			<div id="kv-external-change-message" class="kv-external-change-message"></div>
			<button id="kv-reload-data" class="kv-external-change-button" type="button">重载</button>
		</section>
		<section class="kv-formula-bar">
			<input id="kv-editor-address" class="kv-formula-address" type="text" value="" readonly>
			<button id="kv-formula-help" class="kv-formula-help-button" type="button" title="公式使用指南">
				<span class="codicon codicon-question"></span>
			</button>
			<input id="kv-editor-value" class="kv-formula-value" type="text" disabled>
		</section>
		<section id="kv-empty" class="kv-empty" hidden></section>
		<section id="kv-error" class="kv-empty" hidden></section>
		<section id="kv-table" class="kv-table" hidden></section>
	</div>
</body>

</html>
